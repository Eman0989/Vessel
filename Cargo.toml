[workspace]
resolver = "2"

members = [
    "crates/vessel-core",
    "crates/vessel-runtime",
    "crates/vessel-scheduler",
    "crates/vessel-registry",
    "crates/vessel-policy",
    "crates/vessel-telemetry",
    "crates/vessel-worker",
    "crates/vessel-control",
    "crates/vessel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Eman0989/vessel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace"] }
http-body-util = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json"] }
sha2 = "0.10"
wasmtime = "47.0.2"
wasmtime-wasi = "47.0.3"
